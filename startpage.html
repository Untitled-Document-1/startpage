<!DOCTYPE HTML>
<html>

<head>
    <title>Start page</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=1" />
    <style>
        body {background-color:#3F3F3F; color:#FFF1DD; font-family: "Times New Roman"; font-size: medium; display:flex; flex-direction:column; min-height:100vh; margin:0;}
        a {color:#FFF1DD}
        /* Layout: links scroll in the main area, footer pinned to bottom */
        .content-main {flex:1; overflow:auto; padding:0.5em 1em 0.5em 1em;}
        .footer {flex:0; margin-left:1em; margin-right:1em; padding-bottom:0.6em;}
        input,
        input::-webkit-input-placeholder {
          font-size: 20px;
          width: 284px;
          background-color: white;
          color: black;
        }
        /* Two-column responsive table for links */
        .links-table {width: 100%; border-collapse: collapse;}
        .links-table td {padding: 0.4em; vertical-align: top;}
        .links-table a {display: block; padding: 0.2em 0; color: #FFF1DD; overflow-wrap: break-word;}
        /* Small adjustments for very narrow viewports */
        @media (max-width: 360px) {
          .links-table td {padding: 0.3em;}
          input, input::-webkit-input-placeholder {width: 100%; font-size: 18px}
        }
    </style>
</head>

<body>
    <main class="content-main">
    <table class="links-table">
      <tr>
        <td><a href="https://bbc.co.uk/news/">BBC News</a></td>
        <td><a href="https://yorkpress.co.uk/">York Press</a></td>
      </tr>
      <tr>
        <td><a href="https://yorkmix.com/">York Mix</a></td>
        <td><a href="https://www.bbc.co.uk/weather/2633352">York Weather (BBC)</a></td>
      </tr>
      <tr>
        <td><a href="https://weather.metoffice.gov.uk/forecast/gcx4zrw25">York Weather (Metoffice)</a></td>
        <td><a href="https://hn.algolia.com/?sort=byPopularity&prefix&page=0&dateRange=last24h&type=story">Hacker News</a></td>
      </tr>
      <tr>
        <td><a href="https://www.theregister.com/">The Register</a></td>
        <td><a href="https://arstechnica.com">Ars Technica</a></td>
      </tr>
      <tr>
        <td><a href="https://www.bleepingcomputer.com/">Bleeping Computer</a></td>
        <td><a href="https://www.wikipedia.org/">Wikipedia</a></td>
      </tr>
      <tr>
        <td><a href="https://www.thefreedictionary.com/">Free Dictionary</a></td>
        <td><a href="https://onelook.com/thesaurus/">OneLook Reverse Dictionary</a></td>
      </tr>
      <tr>
        <td><a href="https://www.urbandictionary.com/">Urban Dictionary</a></td>
        <td><a href="https://duckduckgo.com/?q=DuckDuckGo&ia=chat">Duck AI</a></td>
      </tr>
      <tr>
        <td><a href="https://libremdb.iket.me/find">Libremdb</a></td>
        <td><a href="https://downdetector.co.uk">Down Detector</a></td>
      </tr>
      <tr>
        <td><a href="https://192.168.1.254/">Router</a></td>
        <td><a href="https://mygrocerypal.co.uk/">MyGroceryPal</a></td>
      </tr>
      <tr>
        <td colspan="2"><a href="https://playlists.at/youtube/search">YouTube Advanced Search</a></td>
      </tr>
    </table>
    </main>
    <footer class="footer">
      <hr>
      <form action="https://www.google.co.uk/search" method="get" target="_self"> <input name="q" placeholder="Google Search" type="search"> </form>
    </footer>
</body>

</html>
